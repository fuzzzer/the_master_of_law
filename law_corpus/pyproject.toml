[project]
name = "law-corpus-pipeline"
version = "0.1.0"
description = "Georgian legislation data pipeline — scrape, parse, chunk, embed, and index all Georgian laws"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FuzzzyOrganisation" }]

dependencies = [
    # HTTP & Scraping
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<6.0",
    "robotexclusionrulesparser>=1.7,<2.0",

    # PDF Parsing
    "pdfplumber>=0.11,<1.0",
    "pymupdf>=1.24,<2.0",

    # DOCX Parsing
    "python-docx>=1.1,<2.0",

    # Data Models & Validation
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",

    # Embeddings — Vertex AI
    "google-cloud-aiplatform>=1.60,<2.0",

    # Vector Stores
    "chromadb>=0.5,<1.0",

    # CLI
    "typer[all]>=0.12,<1.0",
    "rich>=13.7,<14.0",

    # Utilities
    "python-dotenv>=1.0,<2.0",
    "tenacity>=8.3,<9.0",
    "tiktoken>=0.7,<1.0",
    "aiofiles>=24.0,<25.0",
    "orjson>=3.10,<4.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "respx>=0.21,<1.0",
]
ocr = [
    "pytesseract>=0.3,<1.0",
    "Pillow>=10.3,<11.0",
]

[project.scripts]
law-corpus = "pipeline.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
