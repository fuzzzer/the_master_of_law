[project]
name = "master-of-law-backend"
version = "0.1.0"
description = "AI-powered legal advocate backend for Georgian citizens"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "google-genai>=1.0",
    "firebase-admin>=6.5",
    "chromadb==0.6.3",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "python-multipart>=0.0.9",
    "tenacity>=9.0",
    "orjson>=3.10",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=tests/scripts --ignore=tests/test_scratch.py"
markers = [
    "integration: tests requiring real ChromaDB data (slow, requires corpus)",
]
