# ═══════════════════════════════════════════════════════════════
#  FUZZZY LAW — Docker Compose (Production)
#
#  SECURITY MODEL:
#  ┌─────────────────────────────────────────────────────────┐
#  │  VPS Host Machine                                       │
#  │                                                         │
#  │  ┌───────────────── mol_internal network ──────────────┐│
#  │  │                                                     ││
#  │  │  ┌─────────┐    ┌────────────┐    ┌─────────┐      ││
#  │  │  │   API   │───▶│ PostgreSQL │    │  Redis  │      ││
#  │  │  │ :8000   │    │ :5432      │    │ :6379   │      ││
#  │  │  │ (exposed│    │ (internal  │    │(internal│      ││
#  │  │  │  to host│    │  only, NO  │    │ only,NO │      ││
#  │  │  │  only)  │    │  port map) │    │port map)│      ││
#  │  │  └─────────┘    └────────────┘    └─────────┘      ││
#  │  │       │                                             ││
#  │  └───────┼─────────────────────────────────────────────┘│
#  │          │ 127.0.0.1:8000                               │
#  │          ▼                                              │
#  │    ┌───────────┐                                        │
#  │    │  Nginx /  │  ← reverse proxy, TLS termination     │
#  │    │  Caddy    │  ← exposed to internet on :443        │
#  │    └───────────┘                                        │
#  └─────────────────────────────────────────────────────────┘
#
#  - PostgreSQL: ZERO port exposure. Only API can reach it.
#  - Redis: ZERO port exposure. Only API can reach it.
#  - API: Bound to 127.0.0.1:8000 — only reachable from the
#    host machine. Put Nginx/Caddy in front for HTTPS.
# ═══════════════════════════════════════════════════════════════

services:
  api:
    build: .
    # SECURITY: Only bind to localhost — not 0.0.0.0!
    # A reverse proxy (Nginx/Caddy) handles TLS and forwards here.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Container-only overrides. These beat env_file, which holds the values
      # that are correct OUTSIDE the container — the test suite reads the same
      # .env, and a container hostname or a production APP_ENV there makes
      # local runs fail in ways that have nothing to do with the code.
      APP_ENV: production
      # The deployment's access model: open access, each caller paying with
      # their own Google key. Set here rather than in .env because .env is
      # also the local/test config, where these must keep their defaults.
      AUTH_ENABLED: "false"
      BYOK_REQUIRED: "true"
      BYOK_KEY_HEADER: X-API-Key
      # No server key in the container ON PURPOSE. A fallback here would
      # quietly serve any request that lost its caller key, spending the
      # operator's quota and hiding the bug. .env keeps one for local runs.
      GEMINI_API_KEY: ""
      # Override DB/Redis URLs to use Docker internal hostnames
      DATABASE_URL: postgresql+asyncpg://fuzzzy_user:${POSTGRES_PASSWORD}@postgres:5432/fuzzzy_law
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHROMA_PERSIST_DIR: /app/law_corpus_data/chroma
      # Vertex AI auth — ADC auto-discovers this. Billing goes through GCP.
      # The host path is set via GCP_SA_KEY_PATH in .env (never committed).
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcp-sa-key.json
    volumes:
      # Law corpus data (parsed, chunks, indices) — READ-ONLY
      - ../law_corpus/data:/app/law_corpus_data:ro
      # ChromaDB (SQLite-backed) needs write access for WAL/journal files
      # even during read-only queries. Mounted separately as rw.
      - ../law_corpus/data/chroma:/app/law_corpus_data/chroma:rw
      # GCP credentials — path controlled by .env, mounted READ-ONLY
      # Local dev:  GCP_SA_KEY_PATH=~/.config/gcloud/application_default_credentials.json
      # VPS prod:   GCP_SA_KEY_PATH=/etc/fuzzzy-law/gcp-sa-key.json (chmod 600)
      # Defaulted so the stack still starts with no GCP credential at all,
      # which is the normal case under BYOK_REQUIRED=true: model calls are
      # authenticated per request with the caller's own key and Vertex is
      # never reached. Without the default, compose refuses to start over a
      # file the deployment does not use.
      - ${GCP_SA_KEY_PATH:-/dev/null}:/app/secrets/gcp-sa-key.json:ro
      # Persist temporary API keys
      - ./api_keys.json:/app/api_keys.json:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mol_internal
    restart: unless-stopped
    # Drop all capabilities, run as non-root
    security_opt:
      - no-new-privileges:true
    read_only: false  # App needs /tmp for chromadb

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuzzzy_law
      POSTGRES_USER: fuzzzy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Reject connections from non-internal networks
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzzzy_user -d fuzzzy_law"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # ╔═══════════════════════════════════════════════════════╗
    # ║  NO 'ports:' BLOCK — PostgreSQL is INVISIBLE to     ║
    # ║  the host machine and the internet. Only the API    ║
    # ║  container can reach it via mol_internal network.    ║
    # ╚═══════════════════════════════════════════════════════╝
    networks:
      - mol_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    # Password-protected, append-only for durability
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ╔═══════════════════════════════════════════════════════╗
    # ║  NO 'ports:' BLOCK — Redis is INVISIBLE to the      ║
    # ║  host and internet. Internal only.                   ║
    # ╚═══════════════════════════════════════════════════════╝
    networks:
      - mol_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  mol_internal:
    driver: bridge
    # Private network — only containers in this compose file
    # can communicate. No external access.
    internal: false  # API needs outbound for Vertex AI calls

volumes:
  pgdata:
    # Named volume — persisted across container restarts
    # Back this up regularly!
