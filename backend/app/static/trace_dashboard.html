<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Traces — Fuzzzy Law</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #e2e5ea;
    --ink: #1a1f28; --ink-2: #4b5563; --ink-3: #8a93a1;
    --accent: #2f6fed; --accent-soft: #e8effd;
    --good: #1a7f4b; --good-soft: #e3f4ea;
    --warn: #9a6700; --warn-soft: #fcf1d8;
    --bad: #c03636; --bad-soft: #fbe7e7;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --surface: #1d2129; --border: #313847;
      --ink: #e7eaf0; --ink-2: #aab2bf; --ink-3: #717a89;
      --accent: #6d9bf5; --accent-soft: #22304a;
      --good: #4cc38a; --good-soft: #17301f;
      --warn: #e2b23f; --warn-soft: #33290f;
      --bad: #ef7070; --bad-soft: #3a1c1c;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 650; }
  header .spacer { flex: 1; }
  input, button, select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px;
  }
  button { cursor: pointer; background: var(--surface); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 320px; min-width: 240px; border-right: 1px solid var(--border);
    background: var(--surface); overflow-y: auto;
  }
  #sidebar h2, #tracelist h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-3); padding: 12px 14px 6px;
  }
  .session, .trace-item {
    padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .session:hover, .trace-item:hover { background: var(--accent-soft); }
  .session.active, .trace-item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .session .cid { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .meta { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  #tracelist { width: 340px; min-width: 260px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); }
  .trace-item .msg { font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #detail { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
    padding: 1px 9px; font-size: 11.5px; font-weight: 600;
  }
  .badge.completed { background: var(--good-soft); color: var(--good); }
  .badge.blocked   { background: var(--warn-soft); color: var(--warn); }
  .badge.failed    { background: var(--bad-soft); color: var(--bad); }
  .badge.entry     { background: var(--accent-soft); color: var(--accent); }
  .detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .detail-head h2 { font-size: 16px; }
  .detail-sub { color: var(--ink-3); font-size: 12.5px; font-family: var(--mono); margin-bottom: 14px; word-break: break-all; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 12px; overflow: hidden;
  }
  .panel > .head {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    cursor: pointer; user-select: none;
  }
  .panel > .head:hover { background: var(--accent-soft); }
  .panel .seq { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 24px; }
  .panel .name { font-weight: 600; font-size: 13.5px; }
  .panel .timing { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .panel .ms { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); min-width: 72px; text-align: right; }
  .durbar { height: 6px; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .panel > .body { border-top: 1px solid var(--border); padding: 12px 14px; display: none; }
  .panel.open > .body { display: block; }
  pre {
    font-family: var(--mono); font-size: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-word; max-height: 480px; overflow-y: auto;
  }
  .prose { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; max-height: 480px; overflow-y: auto; }
  .chip { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 12.5px; }
  .kv { color: var(--ink-2); font-size: 12.5px; margin-bottom: 8px; }
  .kv b { color: var(--ink); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  td.mono { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
  details.chunk-content summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  .empty { color: var(--ink-3); padding: 40px; text-align: center; }
  .exports { display: flex; gap: 6px; margin: 0 0 14px; flex-wrap: wrap; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 10px 0 4px; }
  .subtle { color: var(--ink-3); font-size: 12px; }
  @media (max-width: 900px) { #sidebar, #tracelist { display: none; } #sidebar.force, #tracelist.force { display: block; } }
</style>
</head>
<body>
<header>
  <h1>⚖️ Pipeline Traces</h1>
  <span class="subtle">step-by-step AI transparency</span>
  <span class="spacer"></span>
  <input id="apikey" type="password" placeholder="Admin API key (blank in dev)" size="24">
  <button id="refresh" class="primary">Refresh</button>
</header>
<main>
  <nav id="sidebar"><h2>Grounding (7d)</h2><div id="grounding"></div><h2>Sessions</h2><div id="sessions"></div></nav>
  <nav id="tracelist"><h2>Interactions</h2><div id="traces"></div></nav>
  <section id="detail"><div class="empty">Select a session, then an interaction, to inspect every pipeline step.</div></section>
</main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const state = { session: null, trace: null };

const keyInput = $("#apikey");
keyInput.value = localStorage.getItem("trace_admin_key") || "";
keyInput.addEventListener("change", () => localStorage.setItem("trace_admin_key", keyInput.value));

function headers() {
  const h = {};
  if (keyInput.value) h["X-API-Key"] = keyInput.value;
  return h;
}

async function api(path) {
  const res = await fetch(path, { headers: headers() });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit" });
}

// ── Grounding metrics panel (plan 4.1) ─────────────────────
async function loadGroundingMetrics() {
  try {
    const m = await api("/api/v1/traces/metrics/grounding?days=7");
    const pct = r => (r === null || r === undefined) ? "—" : Math.round(r * 100) + "%";
    const row = (label, rateObj, num, den) =>
      `<div class="meta">${label}: <b>${pct(rateObj)}</b> (${num}/${den})</div>`;
    $("#grounding").innerHTML =
      row("Statute grounding", m.statute_grounding.rate, m.statute_grounding.grounded, m.statute_grounding.total) +
      row("Citations clean", m.citation_verification.rate, m.citation_verification.clean, m.citation_verification.with_citations) +
      row("Cases clean", m.case_attribution.rate, m.case_attribution.clean, m.case_attribution.with_cases) +
      row("Deadline coverage", m.deadline_coverage.rate, m.deadline_coverage.with_deadline, m.deadline_coverage.action_advised) +
      row("Unanchored claims", m.anchoring.unanchored_rate, m.anchoring.unanchored, m.anchoring.claim_paragraphs) +
      `<div class="meta">Faithfulness: ${m.faithfulness.unsupported_claims} unsupported in ${m.faithfulness.checked} checked</div>` +
      `<div class="meta">Uncertainty disclaimers: ${m.uncertainty_disclaimers}</div>`;
  } catch (e) { $("#grounding").innerHTML = `<div class="empty">⚠️ ${esc(e.message)}</div>`; }
}

// ── Sessions ────────────────────────────────────────────────
async function loadSessions() {
  try {
    const data = await api("/api/v1/traces/sessions?limit=100");
    const el = $("#sessions");
    el.innerHTML = data.sessions.length ? "" : '<div class="empty">No traces yet</div>';
    for (const s of data.sessions) {
      const div = document.createElement("div");
      div.className = "session" + (s.conversation_id === state.session ? " active" : "");
      div.innerHTML = `<div class="cid">${esc(s.conversation_id || "(no conversation)")}</div>
        <div class="meta">${s.trace_count} interaction${s.trace_count===1?"":"s"} · ${esc(s.user_id||"?")} · ${fmtTime(s.last_activity)}</div>`;
      div.onclick = () => { state.session = s.conversation_id; loadSessions(); loadTraces(); };
      el.appendChild(div);
    }
  } catch (e) { $("#sessions").innerHTML = `<div class="empty">⚠️ ${esc(e.message)}</div>`; }
}

// ── Trace list ──────────────────────────────────────────────
async function loadTraces() {
  if (!state.session) return;
  const data = await api(`/api/v1/traces?conversation_id=${encodeURIComponent(state.session)}&limit=200`);
  const el = $("#traces");
  el.innerHTML = "";
  for (const t of data.traces) {
    const div = document.createElement("div");
    div.className = "trace-item" + (t.id === state.trace ? " active" : "");
    div.innerHTML = `<div class="msg">${esc(t.user_message)}</div>
      <div class="meta"><span class="badge ${esc(t.status)}">${statusIcon(t.status)} ${esc(t.status)}</span>
      ${esc(t.entry_point)} · ${t.step_count} steps · ${t.duration_ms ?? "?"} ms · ${fmtTime(t.created_at)}</div>`;
    div.onclick = () => { state.trace = t.id; loadTraces(); loadDetail(t.id); };
    el.appendChild(div);
  }
  if (!data.traces.length) el.innerHTML = '<div class="empty">No interactions</div>';
}

function statusIcon(s) { return s === "completed" ? "✓" : s === "blocked" ? "⛔" : "✕"; }

// ── Downloads (fetch with auth header → blob) ───────────────
async function download(path, filename) {
  const res = await fetch(path, { headers: headers() });
  if (!res.ok) { alert(`Export failed: ${res.status}`); return; }
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Detail ──────────────────────────────────────────────────
async function loadDetail(id) {
  const t = await api(`/api/v1/traces/${id}`);
  const el = $("#detail");
  const total = Math.max(t.duration_ms || 1, 1);
  const steps = t.steps || [];

  let html = `
    <div class="detail-head">
      <h2>Interaction</h2>
      <span class="badge ${esc(t.status)}">${statusIcon(t.status)} ${esc(t.status)}</span>
      <span class="badge entry">${esc(t.entry_point)}</span>
      <span class="subtle">${t.duration_ms ?? "?"} ms · ${steps.length} steps · ${fmtTime(t.created_at)}</span>
    </div>
    <div class="detail-sub">trace ${esc(t.id)} · conversation ${esc(t.conversation_id)} · user ${esc(t.user_id)}</div>
    <div class="exports">
      <button onclick="download('/api/v1/traces/${t.id}/export?format=markdown','trace_${t.id}.md')">⬇ Trace .md</button>
      <button onclick="download('/api/v1/traces/${t.id}/export?format=text','trace_${t.id}.txt')">⬇ Trace .txt</button>
      <button onclick="download('/api/v1/traces/${t.id}/export?format=json','trace_${t.id}.json')">⬇ Trace .json</button>
      <button onclick="download('/api/v1/traces/conversation/${encodeURIComponent(t.conversation_id)}/export?format=markdown','session_${esc(t.conversation_id)}.md')">⬇ Whole session .md</button>
      <button onclick="download('/api/v1/traces/conversation/${encodeURIComponent(t.conversation_id)}/export?format=json','session_${esc(t.conversation_id)}.json')">⬇ Whole session .json</button>
    </div>`;

  if (t.error) html += `<div class="panel open"><div class="head"><span class="name" style="color:var(--bad)">✕ Error</span></div><div class="body"><pre>${esc(t.error)}</pre></div></div>`;

  steps.forEach((s, i) => {
    const next = steps[i+1];
    const dur = (next ? next.at_ms : total) - s.at_ms;
    const w = Math.max(2, Math.round(dur / total * 160));
    html += `
      <div class="panel" id="step-${s.seq}">
        <div class="head" onclick="this.parentElement.classList.toggle('open')">
          <span class="seq">#${s.seq}</span>
          <span class="name">${esc(labelFor(s.step))}</span>
          <span class="timing"><span class="durbar" style="width:${w}px" title="${dur} ms in this step"></span>
          <span class="ms">+${s.at_ms} ms</span></span>
        </div>
        <div class="body">${renderStep(s)}</div>
      </div>`;
  });

  html += `<div class="section-label">Final response returned to user</div>
    <div class="prose">${esc(t.response_text || "(none)")}</div>`;
  el.innerHTML = html;
  // Auto-open the most informative steps
  ["request_received","rag_final_selection","llm_response","pipeline_result"].forEach(name => {
    const idx = steps.find(s => s.step === name);
    if (idx) $(`#step-${idx.seq}`)?.classList.add("open");
  });
}

const LABELS = {
  request_received: "📥 Request received",
  guardrail_decision: "🛡 Guardrail decision",
  phase_1_plan: "🧭 Phase 1 — Plan (Flash)",
  phase_1_plan_failed: "🧭 Phase 1 — Plan failed (fallback)",
  direct_response_returned: "↩️ Direct response (no RAG)",
  rag_query_expansion: "🔍 RAG — query expansion",
  rag_skipped: "🔍 RAG — skipped",
  rag_vector_search: "🧲 RAG — vector search (embeddings)",
  rag_fulltext_search: "📝 RAG — full-text search",
  rag_merge_dedup: "🔗 RAG — merge & dedup",
  rag_rerank: "🏅 RAG — Gemini rerank",
  rag_final_selection: "📚 RAG — laws given to the model",
  llm_generation_request: "📤 Prompt sent to Gemini",
  llm_requested_tools: "🛠 Model requested tools",
  tool_executed: "⚙️ Tool executed",
  llm_response: "📥 Gemini response",
  citation_verification: "🔎 Citation verification",
  citation_correction: "✏️ Citation self-correction",
  pipeline_result: "✅ Pipeline result",
};
function labelFor(name) { return LABELS[name] || name; }

function kv(obj, keys) {
  return `<div class="kv">` + keys.filter(k => obj[k] !== undefined && obj[k] !== null)
    .map(k => `<b>${esc(k)}</b>: ${esc(typeof obj[k] === "object" ? JSON.stringify(obj[k]) : obj[k])}`)
    .join(" · ") + `</div>`;
}

function renderStep(s) {
  const d = s.data || {};
  switch (s.step) {
    case "request_received":
      return kv(d, ["user_tier","case_file_id","rag_config","mode","case_context_attached"]) +
        `<div class="section-label">User message</div><div class="prose">${esc(d.message)}</div>`;
    case "guardrail_decision":
      return kv(d, ["category","confidence","should_proceed"]) +
        (d.canned_response ? `<div class="section-label">Canned response</div><div class="prose">${esc(d.canned_response)}</div>` : "");
    case "phase_1_plan":
      return kv(d, ["model","intent","needs_rag"]) +
        `<div class="section-label">Search queries planned</div>` +
        (d.search_queries || []).map(q => `<span class="chip">${esc(q)}</span>`).join("") +
        `<div class="section-label">Raw planner output</div><pre>${esc(d.planner_raw_response)}</pre>`;
    case "rag_query_expansion":
      return kv(d, ["expanded_by"]) +
        (d.queries || []).map(q => `<span class="chip">${esc(q)}</span>`).join("") || jsonBlock(d);
    case "rag_vector_search":
    case "rag_fulltext_search":
      return kv(d, ["hit_count","collections","embedding_model"]) + hitTable(d.hits || []);
    case "rag_final_selection":
      return kv(d, ["result_count","threshold_hits"]) + chunkTable(d.chunks || []);
    case "llm_generation_request":
      return kv(d, ["model","history_message_count","available_tools"]) +
        `<div class="section-label">System prompt</div><pre>${esc(d.system_prompt)}</pre>` +
        `<div class="section-label">Message (with retrieved law context)</div><pre>${esc(d.message_with_law_context)}</pre>`;
    case "llm_response":
      return kv(d, ["iteration"]) + `<div class="prose">${esc(d.text)}</div>`;
    case "citation_verification":
      return kv(d, ["iteration","skipped_corpus_check","reason"]) +
        citeList("Extracted from response", d.extracted) +
        citeList("✓ Verified against retrieved chunks", d.verified) +
        citeList("📚 Found via live corpus lookup", d.corpus_found) +
        citeList("⚠️ NOT found (possible hallucination)", d.not_found);
    case "citation_correction":
      return citeList("Hallucinated citations", d.hallucinated_citations) +
        `<div class="section-label">Corrected response</div><div class="prose">${esc(d.corrected_text)}</div>`;
    case "pipeline_result":
      return kv(d, ["chunk_count","verify_iterations","tool_calls"]) +
        citeList("Final citations", d.citations) +
        `<div class="section-label">Response text</div><div class="prose">${esc(d.response_text)}</div>`;
    default:
      return jsonBlock(d);
  }
}

function jsonBlock(d) { return `<pre>${esc(JSON.stringify(d, null, 2))}</pre>`; }

function hitTable(hits) {
  if (!hits.length) return '<div class="subtle">No hits</div>';
  const rows = hits.map(h => `<tr>
    <td class="mono">${esc(h.chunk_id)}</td><td>${esc(h.code_name)}</td><td>${esc(h.article_number)}</td>
    <td>${esc(h.collection || h.source)}</td><td class="mono">${h.distance ?? ""}</td><td class="mono">${h.query_index ?? ""}</td>
  </tr>`).join("");
  return `<div style="max-height:340px;overflow:auto"><table>
    <tr><th>chunk_id</th><th>code</th><th>article</th><th>source</th><th>distance</th><th>q#</th></tr>${rows}</table></div>`;
}

function chunkTable(chunks) {
  if (!chunks.length) return '<div class="subtle">No chunks</div>';
  const rows = chunks.map(c => `<tr>
    <td class="mono">${esc(c.chunk_id)}</td>
    <td>${esc(c.code_name)}<div class="subtle">${esc(c.article_number)} ${esc(c.article_title||"")}</div>
      ${c.article_url ? `<a href="${esc(c.article_url)}" target="_blank" rel="noopener">law source ↗</a>` : ""}</td>
    <td>${esc(c.collection)}</td><td class="mono">${c.distance?.toFixed ? c.distance.toFixed(4) : (c.distance ?? "")}</td>
    <td><details class="chunk-content"><summary>full text</summary><pre>${esc(c.content)}</pre></details></td>
  </tr>`).join("");
  return `<div style="max-height:520px;overflow:auto"><table>
    <tr><th>chunk_id</th><th>law / article</th><th>collection</th><th>distance</th><th>content</th></tr>${rows}</table></div>`;
}

function citeList(title, items) {
  if (!items || !items.length) return "";
  return `<div class="section-label">${title}</div>` +
    `<div>${items.map(c => `<span class="chip">${esc(c.code_name || "")} ${esc(c.article_number || c.raw_text || JSON.stringify(c))}</span>`).join("")}</div>`;
}

$("#refresh").onclick = () => { loadSessions(); if (state.session) loadTraces(); };
loadSessions();
</script>
</body>
</html>
